# [TV1] Trino đọc bảng Parquet trên HDFS qua Hive Metastore
connector.name=hive
hive.metastore.uri=thrift://hive-metastore.serving.svc.cluster.local:9083
fs.hadoop.enabled=true
hive.config.resources=/etc/trino/hadoop/core-site.xml,/etc/trino/hadoop/hdfs-site.xml
hive.non-managed-table-writes-enabled=false
hive.storage-format=PARQUET
# bỏ qua thư mục ẩn như _spark_metadata của streaming sink
hive.ignore-absent-partitions=true
