# [TV3] Cassandra 3 node (slide 4.1–4.3): consistent hashing với 16 vnode/node, gossip,
# hinted handoff, anti-entropy repair (Merkle tree) — đúng các cơ chế của Dynamo.
apiVersion: v1
kind: Service
metadata: {name: cassandra, namespace: storage, labels: {app: cassandra}}
spec:
  clusterIP: None
  selector: {app: cassandra}
  ports: [{name: cql, port: 9042}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: cassandra, namespace: storage}
spec:
  serviceName: cassandra
  replicas: 3
  selector: {matchLabels: {app: cassandra}}
  template:
    metadata: {labels: {app: cassandra}}
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app: cassandra}}
      containers:
        - name: cassandra
          image: cassandra:4.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              sed -i 's/^authenticator:.*/authenticator: PasswordAuthenticator/; s/^authorizer:.*/authorizer: CassandraAuthorizer/' /etc/cassandra/cassandra.yaml
              exec docker-entrypoint.sh cassandra -f
          env:
            - {name: CASSANDRA_CLUSTER_NAME, value: shoppulse}
            - {name: CASSANDRA_DC, value: dc1}
            - {name: CASSANDRA_RACK, value: rack1}
            - {name: CASSANDRA_ENDPOINT_SNITCH, value: GossipingPropertyFileSnitch}
            - {name: CASSANDRA_SEEDS, value: "cassandra-0.cassandra.storage.svc.cluster.local"}
            - {name: CASSANDRA_NUM_TOKENS, value: "16"}
            - {name: MAX_HEAP_SIZE, value: 768M}
            - {name: HEAP_NEWSIZE, value: 200M}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports: [{containerPort: 9042, name: cql}, {containerPort: 7000, name: intra-node}]
          readinessProbe:
            exec: {command: ["/bin/bash", "-c", "nodetool status | grep -E \"^UN\\s+${POD_IP}\""]}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          lifecycle:
            preStop: {exec: {command: ["/bin/sh", "-c", "nodetool drain"]}}
          resources: {requests: {cpu: 250m, memory: 1280Mi}, limits: {memory: 1536Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/cassandra}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
