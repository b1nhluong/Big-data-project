# [TV3] Redis: key-value trong RAM (slide 4.1) cho top-K trending và cache API
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: storage}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: storage}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--maxmemory", "256mb",
                 "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: shoppulse-secrets, key: REDIS_PASSWORD}}
          ports: [{containerPort: 6379}]
          readinessProbe: {tcpSocket: {port: 6379}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 320Mi}}
