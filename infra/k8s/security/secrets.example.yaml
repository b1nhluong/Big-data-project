# [TV1] MẪU Secret — sao chép thành secrets.yaml (đã .gitignore), điền giá trị thật:
#   cp infra/k8s/security/secrets.example.yaml infra/k8s/security/secrets.yaml
#   python -c "import secrets;print(secrets.token_hex(24))"   # sinh mật khẩu
# KHÔNG commit secrets.yaml. Cùng một Secret được tạo ở mọi namespace cần dùng.
apiVersion: v1
kind: Secret
metadata: {name: shoppulse-secrets, namespace: compute}
type: Opaque
stringData:
  PII_SALT: "CHANGE_ME_long_random_salt"          # salt băm user_id — đổi salt = mất liên kết lịch sử
  KAFKA_USERNAME: "spark"                          # Strimzi sinh mật khẩu trong Secret "spark" (ns kafka)
  KAFKA_PASSWORD: "CHANGE_ME"
  CASSANDRA_ADMIN_PASSWORD: "CHANGE_ME"
  CASSANDRA_USERNAME: "shoppulse_writer"
  CASSANDRA_PASSWORD: "CHANGE_ME"
  CASSANDRA_READER_USER: "dashboard_reader"
  CASSANDRA_READER_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  POSTGRES_USER: "shoppulse"
  POSTGRES_PASSWORD: "CHANGE_ME"
  HIVE_DB_PASSWORD: "CHANGE_ME"
